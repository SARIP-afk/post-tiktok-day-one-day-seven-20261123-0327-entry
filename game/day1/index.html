<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STAR DODGE — Day 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d0618; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
"use strict";
/*
 * STAR DODGE — DAY 1
 * One prompt, one tiny game: a neon ship dodges falling rocks and
 * scoops up stars. Move with ← → / A D, or just move the mouse.
 * Three hearts. Lose them all and it is game over — press R to fly again.
 * Add ?demo=1 to the URL and the ship steers itself.
 */
const stage = document.getElementById("stage");
const paint = stage.getContext("2d");
const ARENA_W = 1280;
const ARENA_H = 720;
const SHIP_ROW = 628;
const SHIP_HALF = 30;
const autoplay = new URLSearchParams(location.search).get("demo") === "1";

// ---- state ---------------------------------------------------------------
const ship = { x: ARENA_W / 2, speed: 640 };
const state = {
  rocks: [],
  pickups: [],
  points: 0,
  hearts: 3,
  finished: false,
  grace: 0,          // seconds of post-hit blinking
  clock: 0,          // seconds since (re)start
  rockClock: 0,      // time until the next rock
  starClock: 0.4,    // time until the next star
  prevStamp: 0,
};
const held = {};

// ---- backdrop ------------------------------------------------------------
const dusk = paint.createLinearGradient(0, 0, 0, ARENA_H);
dusk.addColorStop(0.0, "#160a33");
dusk.addColorStop(0.5, "#4d1660");
dusk.addColorStop(0.8, "#b81e7e");
dusk.addColorStop(1.0, "#ff8a3c");

const specks = [];
for (let i = 0; i < 130; i++) {
  specks.push({
    x: Math.random() * ARENA_W,
    y: Math.random() * ARENA_H * 0.55,
    size: 0.5 + Math.random() * 1.7,
    phase: Math.random() * Math.PI * 2,
  });
}

// ---- input ---------------------------------------------------------------
addEventListener("keydown", (ev) => {
  held[ev.key] = true;
  if (state.finished && (ev.key === "r" || ev.key === "R")) restart();
  if (ev.key === " " || ev.key.indexOf("Arrow") === 0) ev.preventDefault();
});
addEventListener("keyup", (ev) => { held[ev.key] = false; });
addEventListener("mousemove", (ev) => {
  const box = stage.getBoundingClientRect();
  ship.x = ((ev.clientX - box.left) / box.width) * ARENA_W;
});

// ---- spawners ------------------------------------------------------------
function restart() {
  state.rocks = [];
  state.pickups = [];
  state.points = 0;
  state.hearts = 3;
  state.finished = false;
  state.grace = 0;
  state.clock = 0;
  state.rockClock = 0;
  state.starClock = 0.4;
  ship.x = ARENA_W / 2;
}

function dropRock() {
  state.rocks.push({
    x: 50 + Math.random() * (ARENA_W - 100),
    y: -36,
    radius: 15 + Math.random() * 17,
    fall: 160 + Math.random() * 110 + state.clock * 5,
    drift: (Math.random() - 0.5) * 55,
    spin: Math.random() * Math.PI * 2,
    spinRate: (Math.random() - 0.5) * 2.2,
    bumps: Array.from({ length: 9 }, () => 0.82 + Math.random() * 0.36),
  });
}

function dropStar() {
  state.pickups.push({
    x: 50 + Math.random() * (ARENA_W - 100),
    y: -22,
    radius: 13,
    fall: 115 + Math.random() * 65,
    spin: 0,
  });
}

function gap(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return dx * dx + dy * dy;
}

// ---- autopilot (demo mode) -----------------------------------------------
function steerSelf(dt) {
  // For every landing spot nearby, simulate the ship flying there and
  // work out when the first rock would catch it on the way (rocks drift
  // sideways, so project where each one will be when it crosses the
  // ship's row, and where the ship will be at that same moment).
  // Take the spot with the latest first hit; among equals, drift toward
  // the lowest star the ship can still reach in time.
  const slots = [];
  for (let off = -340; off <= 340; off += 85) {
    slots.push(Math.max(SHIP_HALF, Math.min(ARENA_W - SHIP_HALF, ship.x + off)));
  }
  let choice = ship.x;
  let bestScore = -Infinity;
  for (const spot of slots) {
    let survive = 2.5;
    for (const rock of state.rocks) {
      if (rock.y >= SHIP_ROW || rock.fall <= 0) continue;
      const eta = (SHIP_ROW - rock.y) / rock.fall;
      if (eta < 0 || eta > 2.5) continue;
      const rockX = rock.x + rock.drift * eta;
      const shift = Math.max(-ship.speed * eta, Math.min(ship.speed * eta, spot - ship.x));
      if (Math.abs(rockX - (ship.x + shift)) < rock.radius + 28) {
        survive = Math.min(survive, eta);
      }
    }
    // Only the next ~1.6 s of danger matters: beyond that every spot is
    // equally safe, so the ship is free to chase a star.
    const safety = Math.min(survive, 1.6) * 10;
    let pull = 0;
    const reachable = state.pickups.filter((star) => {
      if (star.y >= SHIP_ROW - 40) return false;
      const timeLeft = (SHIP_ROW - star.y) / star.fall;
      const travel = Math.max(0, Math.abs(star.x - ship.x) - 20) / ship.speed;
      return timeLeft >= travel;
    });
    if (reachable.length) {
      let lowest = reachable[0];
      for (const star of reachable) if (star.y > lowest.y) lowest = star;
      pull = (Math.abs(lowest.x - spot) / ARENA_W) * 3;
    }
    const wander = (Math.abs(spot - ship.x) / ARENA_W) * 0.5;
    const score = safety - pull - wander;
    if (score > bestScore) { bestScore = score; choice = spot; }
  }
  const shift = choice - ship.x;
  ship.x += Math.max(-ship.speed * dt, Math.min(ship.speed * dt, shift));
}

// ---- simulation ----------------------------------------------------------
function step(dt) {
  if (state.finished) return;
  state.clock += dt;
  if (state.grace > 0) state.grace -= dt;

  if (autoplay) steerSelf(dt);
  else {
    if (held.ArrowLeft || held.a || held.A) ship.x -= ship.speed * dt;
    if (held.ArrowRight || held.d || held.D) ship.x += ship.speed * dt;
  }
  ship.x = Math.max(SHIP_HALF, Math.min(ARENA_W - SHIP_HALF, ship.x));

  state.rockClock -= dt;
  state.starClock -= dt;
  if (state.rockClock <= 0) {
    dropRock();
    state.rockClock = Math.max(0.3, 0.74 - state.clock * 0.008);
  }
  if (state.starClock <= 0) {
    dropStar();
    state.starClock = 1.15;
  }

  for (const rock of state.rocks) {
    rock.y += rock.fall * dt;
    rock.x += rock.drift * dt;
    rock.spin += rock.spinRate * dt;
  }
  for (const star of state.pickups) {
    star.y += star.fall * dt;
    star.spin += dt * 2.2;
  }
  state.rocks = state.rocks.filter((rock) => rock.y < ARENA_H + 70);
  state.pickups = state.pickups.filter((star) => star.y < ARENA_H + 50);

  const shipPoint = { x: ship.x, y: SHIP_ROW };
  for (const star of state.pickups) {
    if (gap(star, shipPoint) < (star.radius + 26) * (star.radius + 26)) {
      state.points += 10;
      star.y = ARENA_H + 999;
    }
  }
  state.pickups = state.pickups.filter((star) => star.y < ARENA_H + 50);

  if (state.grace <= 0) {
    for (const rock of state.rocks) {
      if (gap(rock, shipPoint) < (rock.radius + 24) * (rock.radius + 24)) {
        state.hearts -= 1;
        state.grace = 1.6;
        rock.y = ARENA_H + 999;
        if (state.hearts <= 0) state.finished = true;
        break;
      }
    }
  }
  state.rocks = state.rocks.filter((rock) => rock.y < ARENA_H + 70);
}

// ---- drawing -------------------------------------------------------------
function drawSparkle(x, y, radius, angle, colour) {
  paint.save();
  paint.translate(x, y);
  paint.rotate(angle);
  paint.fillStyle = colour;
  paint.shadowColor = colour;
  paint.shadowBlur = 14;
  paint.beginPath();
  for (let i = 0; i < 8; i++) {
    const r = i % 2 === 0 ? radius : radius * 0.45;
    const a = (i * Math.PI) / 4 - Math.PI / 2;
    if (i === 0) paint.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else paint.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  paint.closePath();
  paint.fill();
  paint.restore();
}

function drawRock(rock) {
  paint.save();
  paint.translate(rock.x, rock.y);
  paint.rotate(rock.spin);
  paint.fillStyle = "#3a2727";
  paint.strokeStyle = "#ff7a3d";
  paint.lineWidth = 3;
  paint.shadowColor = "#ff7a3d";
  paint.shadowBlur = 16;
  paint.beginPath();
  for (let i = 0; i < rock.bumps.length; i++) {
    const a = (i / rock.bumps.length) * Math.PI * 2;
    const r = rock.radius * rock.bumps[i];
    if (i === 0) paint.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else paint.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  paint.closePath();
  paint.fill();
  paint.stroke();
  paint.restore();
}

function drawPlayer() {
  // Blink while the post-hit grace period is running.
  if (state.grace > 0 && Math.floor(state.grace * 12) % 2 === 0) return;
  paint.save();
  paint.translate(ship.x, SHIP_ROW);
  paint.fillStyle = "#22e6ff";
  paint.strokeStyle = "#eafcff";
  paint.lineWidth = 2.5;
  paint.shadowColor = "#22e6ff";
  paint.shadowBlur = 22;
  paint.beginPath();
  paint.moveTo(0, -26);
  paint.lineTo(14, 2);
  paint.lineTo(28, 20);
  paint.lineTo(10, 14);
  paint.lineTo(0, 22);
  paint.lineTo(-10, 14);
  paint.lineTo(-28, 20);
  paint.lineTo(-14, 2);
  paint.closePath();
  paint.fill();
  paint.stroke();
  // cockpit
  paint.fillStyle = "#ff5ea8";
  paint.beginPath();
  paint.arc(0, -6, 6.5, 0, Math.PI * 2);
  paint.fill();
  // engine glow
  paint.fillStyle = "#ffd94d";
  paint.shadowColor = "#ffd94d";
  paint.shadowBlur = 12;
  paint.beginPath();
  paint.moveTo(-6, 22);
  paint.lineTo(0, 34 + Math.random() * 6);
  paint.lineTo(6, 22);
  paint.closePath();
  paint.fill();
  paint.restore();
}

function render() {
  paint.fillStyle = dusk;
  paint.fillRect(0, 0, ARENA_W, ARENA_H);

  for (const speck of specks) {
    paint.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(state.clock * 1.4 + speck.phase));
    paint.fillStyle = "#ffffff";
    paint.beginPath();
    paint.arc(speck.x, speck.y, speck.size, 0, Math.PI * 2);
    paint.fill();
  }
  paint.globalAlpha = 1;

  // warm glow hugging the bottom edge
  const horizon = paint.createRadialGradient(ARENA_W / 2, ARENA_H, 30, ARENA_W / 2, ARENA_H, 640);
  horizon.addColorStop(0, "rgba(255,150,60,0.5)");
  horizon.addColorStop(1, "rgba(255,150,60,0)");
  paint.fillStyle = horizon;
  paint.fillRect(0, 0, ARENA_W, ARENA_H);

  for (const star of state.pickups) drawSparkle(star.x, star.y, star.radius, star.spin, "#ffd94d");
  for (const rock of state.rocks) drawRock(rock);
  drawPlayer();

  // HUD
  paint.fillStyle = "#ffffff";
  paint.font = "bold 30px system-ui, sans-serif";
  paint.textAlign = "left";
  paint.fillText("SCORE " + state.points, 24, 46);
  paint.textAlign = "right";
  paint.fillStyle = "#ff5ea8";
  paint.fillText("♥".repeat(Math.max(0, state.hearts)) + "♡".repeat(Math.max(0, 3 - state.hearts)), ARENA_W - 24, 46);
  paint.textAlign = "center";
  paint.fillStyle = "rgba(255,255,255,0.75)";
  paint.font = "600 20px system-ui, sans-serif";
  paint.fillText("STAR DODGE — DAY 1", ARENA_W / 2, 44);

  if (state.finished) {
    paint.fillStyle = "rgba(10,4,24,0.72)";
    paint.fillRect(0, 0, ARENA_W, ARENA_H);
    paint.fillStyle = "#ffffff";
    paint.font = "bold 64px system-ui, sans-serif";
    paint.fillText("GAME OVER", ARENA_W / 2, ARENA_H / 2 - 20);
    paint.font = "32px system-ui, sans-serif";
    paint.fillText("Score: " + state.points + "  —  press R to play again", ARENA_W / 2, ARENA_H / 2 + 40);
  }
}

function loop(stamp) {
  const dt = Math.min(0.05, (stamp - state.prevStamp) / 1000 || 0.016);
  state.prevStamp = stamp;
  step(dt);
  render();
  requestAnimationFrame(loop);
}

window.__game = {
  get score() { return state.points; },
  get lives() { return state.hearts; },
  get over() { return state.finished; },
  get elapsed() { return state.clock; },
  get rocks() { return state.rocks.length; },
  get stars() { return state.pickups.length; },
  get shipX() { return ship.x; },
};
restart();
requestAnimationFrame(loop);
</script>
</body>
</html>
